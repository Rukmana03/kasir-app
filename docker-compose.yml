services:
  db:
    image: mysql:8.0
    container_name: bakmi_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: waroeng_bakmi_db
      MYSQL_USER: bakmi_user
      MYSQL_PASSWORD: bakmipassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
